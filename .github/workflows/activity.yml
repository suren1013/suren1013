name: Refresh public activity landscape

on:
  schedule:
    - cron: '0 2 * * *' # 07:30 Asia/Calcutta (UTC+05:30)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-activity-landscape
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'suren1013/suren1013'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Install renderer and fonts
        run: |
          python -m pip install -r tools/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
      - name: Test calendar validation
        run: python -m unittest discover -s tests -v
      - name: Fetch, validate, and render
        run: python tools/activity.py --username suren1013 --output-dir assets
      - name: Commit only generated activity files
        run: |
          git add -- assets/activity-data.json assets/activity-landscape.png assets/activity-landscape-mobile.png assets/activity-summary.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh public contribution landscape'
          git push
