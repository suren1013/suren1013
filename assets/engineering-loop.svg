<svg width="920" height="222" viewBox="0 0 920 222" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Engineering build loop</title>
  <desc id="desc">An animated workflow showing the cycle from problem to model, simulation, validation, and shipping.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="920" y2="222" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="0.5" stop-color="#111A21"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="signal" x1="74" y1="0" x2="846" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4B942"/>
      <stop offset="0.5" stop-color="#23C9E8"/>
      <stop offset="1" stop-color="#F4B942"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="920" height="222" rx="12" fill="url(#panel)"/>
  <rect x="0.5" y="0.5" width="919" height="221" rx="11.5" stroke="#23313A"/>

  <text x="28" y="31" fill="#E6EDF3" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="2">ENGINEERING BUILD LOOP</text>
  <text x="892" y="31" text-anchor="end" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing="1.4">ITERATE / LEARN / IMPROVE</text>

  <path d="M74 93H846" stroke="#27343D" stroke-width="2"/>
  <path d="M846 93C886 93 888 184 846 184H74C30 184 30 93 74 93" stroke="#23313A" stroke-width="1.5" stroke-dasharray="5 7"/>
  <path d="M74 93H846" stroke="url(#signal)" stroke-width="2" stroke-dasharray="70 702">
    <animate attributeName="stroke-dashoffset" values="0;-772" dur="5s" repeatCount="indefinite"/>
  </path>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <g transform="translate(74 93)">
      <circle r="25" fill="#141C22" stroke="#F4B942" stroke-width="2"/>
      <path d="M-8-2h16M-8 4h11M-8-8h10" stroke="#F4B942" stroke-width="2" stroke-linecap="round"/>
      <circle r="31" stroke="#F4B942" opacity="0"><animate attributeName="r" values="25;34" dur="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".5;0" dur="2.5s" repeatCount="indefinite"/></circle>
      <text y="47" text-anchor="middle" fill="#E6EDF3" font-size="12" font-weight="700">PROBLEM</text>
      <text y="64" text-anchor="middle" fill="#8B949E" font-size="9">define reality</text>
    </g>
    <g transform="translate(267 93)">
      <circle r="25" fill="#141C22" stroke="#D8A93F" stroke-width="2"/>
      <path d="M-10 8L0-10 10 8H-10ZM-5 2H5" stroke="#E8B641" stroke-width="1.8" stroke-linejoin="round"/>
      <circle r="31" stroke="#F4B942" opacity="0"><animate attributeName="r" values="25;34" begin="1s" dur="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".5;0" begin="1s" dur="2.5s" repeatCount="indefinite"/></circle>
      <text y="47" text-anchor="middle" fill="#E6EDF3" font-size="12" font-weight="700">MODEL</text>
      <text y="64" text-anchor="middle" fill="#8B949E" font-size="9">reduce + measure</text>
    </g>
    <g transform="translate(460 93)">
      <circle r="25" fill="#141C22" stroke="#23C9E8" stroke-width="2"/>
      <path d="M-11 7C-6-9-1 14 4-5C7-15 10 1 12 7" stroke="#23C9E8" stroke-width="2" stroke-linecap="round"/>
      <circle r="31" stroke="#23C9E8" opacity="0"><animate attributeName="r" values="25;34" begin="2s" dur="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".5;0" begin="2s" dur="2.5s" repeatCount="indefinite"/></circle>
      <text y="47" text-anchor="middle" fill="#E6EDF3" font-size="12" font-weight="700">SIMULATE</text>
      <text y="64" text-anchor="middle" fill="#8B949E" font-size="9">compute behavior</text>
    </g>
    <g transform="translate(653 93)">
      <circle r="25" fill="#141C22" stroke="#49D6C3" stroke-width="2"/>
      <path d="M-10 1L-3 8 11-8" stroke="#49D6C3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle r="31" stroke="#49D6C3" opacity="0"><animate attributeName="r" values="25;34" begin="3s" dur="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".5;0" begin="3s" dur="2.5s" repeatCount="indefinite"/></circle>
      <text y="47" text-anchor="middle" fill="#E6EDF3" font-size="12" font-weight="700">VALIDATE</text>
      <text y="64" text-anchor="middle" fill="#8B949E" font-size="9">check assumptions</text>
    </g>
    <g transform="translate(846 93)">
      <circle r="25" fill="#141C22" stroke="#F4B942" stroke-width="2"/>
      <path d="M-10 7V-7L1-12V12L-10 7ZM1 0L12-6V6L1 12" stroke="#F4B942" stroke-width="1.8" stroke-linejoin="round"/>
      <circle r="31" stroke="#F4B942" opacity="0"><animate attributeName="r" values="25;34" begin="4s" dur="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".5;0" begin="4s" dur="2.5s" repeatCount="indefinite"/></circle>
      <text y="47" text-anchor="middle" fill="#E6EDF3" font-size="12" font-weight="700">SHIP</text>
      <text y="64" text-anchor="middle" fill="#8B949E" font-size="9">make it useful</text>
    </g>
  </g>

  <circle r="5" fill="#FFFFFF" filter="url(#glow)">
    <animateMotion path="M74 93H846C886 93 888 184 846 184H74C30 184 30 93 74 93" dur="8s" repeatCount="indefinite"/>
  </circle>
  <text x="460" y="188" text-anchor="middle" fill="#5F6E78" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9" letter-spacing="1.2">FEEDBACK CLOSES THE LOOP</text>
</svg>
