<svg width="920" height="230" viewBox="0 0 920 230" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" focusable="false">
  <title id="title">Selected project telemetry</title>
  <desc id="desc">An animated signal connects three project modules: Casting Assistant with six alloys, Customer CLV Dashboard with ten cleaning steps, twelve metrics and seven segments, and the Tamil Nadu Election Dashboard with 234 constituencies and a 60-second refresh.</desc>
  <style>
    @media (prefers-reduced-motion: reduce) {
      .motion { display: none; }
    }
  </style>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="920" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="0.48" stop-color="#111A21"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="rail" x1="48" y1="0" x2="872" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4B942"/>
      <stop offset="0.5" stop-color="#23C9E8"/>
      <stop offset="1" stop-color="#49D6C3"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#23C9E8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#23C9E8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cardGlow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="920" height="230" rx="12" fill="url(#background)"/>
  <rect x="0.5" y="0.5" width="919" height="229" rx="11.5" stroke="#23313A"/>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <text x="28" y="29" fill="#E6EDF3" font-size="13" font-weight="700" letter-spacing="2">PROJECT TELEMETRY</text>
    <text x="892" y="29" text-anchor="end" fill="#8B949E" font-size="9" letter-spacing="1.4">VERIFIED CAPABILITIES / 03 NODES</text>
  </g>

  <path d="M48 57H872" stroke="#263640" stroke-width="2"/>
  <path d="M48 57H872" stroke="url(#rail)" stroke-width="2" stroke-dasharray="74 750" class="motion">
    <animate attributeName="stroke-dashoffset" values="74;-750" dur="7s" repeatCount="indefinite"/>
  </path>
  <g stroke="#334650" stroke-width="1.5">
    <path d="M160 57V72"/><path d="M460 57V72"/><path d="M760 57V72"/>
  </g>

  <g class="motion" filter="url(#glow)">
    <circle r="4" fill="#FFFFFF"><animateMotion path="M48 57H872" dur="7s" repeatCount="indefinite"/></circle>
    <circle r="3" fill="#23C9E8" opacity="0.72"><animateMotion path="M48 57H872" begin="-0.18s" dur="7s" repeatCount="indefinite"/></circle>
    <circle r="2.4" fill="#23C9E8" opacity="0.46"><animateMotion path="M48 57H872" begin="-0.36s" dur="7s" repeatCount="indefinite"/></circle>
    <circle r="1.8" fill="#F4B942" opacity="0.3"><animateMotion path="M48 57H872" begin="-0.54s" dur="7s" repeatCount="indefinite"/></circle>
  </g>

  <g>
    <rect x="28" y="72" width="264" height="126" rx="8" fill="#111920" stroke="#2B3A44"/>
    <rect x="328" y="72" width="264" height="126" rx="8" fill="#111920" stroke="#2B3A44"/>
    <rect x="628" y="72" width="264" height="126" rx="8" fill="#111920" stroke="#2B3A44"/>
    <path d="M292 134H328M592 134H628" stroke="#344752" stroke-width="1.5" stroke-dasharray="3 4"/>
  </g>

  <g class="motion" fill="none" stroke-width="1.6" filter="url(#cardGlow)">
    <rect x="28" y="72" width="264" height="126" rx="8" stroke="#F4B942" opacity="0">
      <animate attributeName="opacity" values="0;.9;.9;0;0;0" keyTimes="0;.03;.26;.32;.99;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="328" y="72" width="264" height="126" rx="8" stroke="#23C9E8" opacity="0">
      <animate attributeName="opacity" values="0;0;.9;.9;0;0" keyTimes="0;.31;.36;.59;.65;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="628" y="72" width="264" height="126" rx="8" stroke="#49D6C3" opacity="0">
      <animate attributeName="opacity" values="0;0;.9;.9;0" keyTimes="0;.64;.69;.92;1" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g class="motion">
    <rect x="35" y="76" width="250" height="1.5" fill="url(#scan)" opacity="0">
      <animate attributeName="y" values="76;190;190" keyTimes="0;.28;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.62;0;0" keyTimes="0;.04;.28;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="335" y="76" width="250" height="1.5" fill="url(#scan)" opacity="0">
      <animate attributeName="y" values="76;76;190;190" keyTimes="0;.33;.61;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;.62;0;0" keyTimes="0;.33;.37;.61;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="635" y="76" width="250" height="1.5" fill="url(#scan)" opacity="0">
      <animate attributeName="y" values="76;76;190;190" keyTimes="0;.66;.94;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;.62;0;0" keyTimes="0;.66;.70;.94;1" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <g transform="translate(44 0)">
      <circle cx="5" cy="93" r="3" fill="#F4B942"/>
      <text x="16" y="97" fill="#F4B942" font-size="10" font-weight="700" letter-spacing="1.2">01 / CASTING ASSISTANT</text>
      <text x="0" y="133" fill="#F7C45A" font-size="27" font-weight="700">06</text>
      <text x="42" y="132" fill="#C9D1D9" font-size="10" letter-spacing="1.4">ALLOYS</text>
      <path d="M0 146H232" stroke="#293944"/>
      <text x="0" y="166" fill="#E6EDF3" font-size="10" letter-spacing="1">RISER / YIELD / RISK</text>
      <g transform="translate(178 112)" fill="#4A3D25">
        <rect width="12" height="24" rx="2"/><rect x="17" y="7" width="12" height="17" rx="2"/><rect x="34" y="12" width="12" height="12" rx="2"/>
      </g>
      <g transform="translate(178 112)" fill="#F4B942" opacity="0.72" class="motion">
        <rect width="12" height="24" rx="2"><animate attributeName="height" values="5;24;24;5;5" keyTimes="0;.06;.25;.31;1" dur="7s" repeatCount="indefinite"/><animate attributeName="y" values="19;0;0;19;19" keyTimes="0;.06;.25;.31;1" dur="7s" repeatCount="indefinite"/></rect>
        <rect x="17" y="7" width="12" height="17" rx="2"><animate attributeName="opacity" values=".2;1;1;.2;.2" keyTimes="0;.08;.25;.31;1" dur="7s" repeatCount="indefinite"/></rect>
        <rect x="34" y="12" width="12" height="12" rx="2"><animate attributeName="opacity" values=".2;1;1;.2;.2" keyTimes="0;.1;.25;.31;1" dur="7s" repeatCount="indefinite"/></rect>
      </g>
      <text x="0" y="185" fill="#72818B" font-size="8.5" letter-spacing="1">3D SCHEMATIC / DESIGN FLAGS</text>
    </g>

    <g transform="translate(344 0)">
      <circle cx="5" cy="93" r="3" fill="#23C9E8"/>
      <text x="16" y="97" fill="#23C9E8" font-size="10" font-weight="700" letter-spacing="1.2">02 / CLV DASHBOARD</text>
      <text x="0" y="133" fill="#49D8EF" font-size="27" font-weight="700">10</text>
      <text x="42" y="132" fill="#C9D1D9" font-size="10" letter-spacing="1.2">CLEANING STEPS</text>
      <path d="M0 146H232" stroke="#293944"/>
      <text x="0" y="166" fill="#E6EDF3" font-size="10" letter-spacing="1">12 METRICS / 7 SEGMENTS</text>
      <g transform="translate(178 112)" fill="#1D414B">
        <rect width="46" height="4" rx="2"/><rect y="9" width="36" height="4" rx="2"/><rect y="18" width="25" height="4" rx="2"/>
      </g>
      <g transform="translate(178 112)" fill="#23C9E8" opacity="0.78" class="motion">
        <rect width="46" height="4" rx="2"><animate attributeName="width" values="4;4;46;46;4;4" keyTimes="0;.34;.41;.59;.65;1" dur="7s" repeatCount="indefinite"/></rect>
        <rect y="9" width="36" height="4" rx="2"><animate attributeName="width" values="4;4;36;36;4;4" keyTimes="0;.36;.43;.59;.65;1" dur="7s" repeatCount="indefinite"/></rect>
        <rect y="18" width="25" height="4" rx="2"><animate attributeName="width" values="4;4;25;25;4;4" keyTimes="0;.38;.45;.59;.65;1" dur="7s" repeatCount="indefinite"/></rect>
      </g>
      <text x="0" y="185" fill="#72818B" font-size="8.5" letter-spacing="1">UPLOAD / ANALYZE / EXPORT</text>
    </g>

    <g transform="translate(644 0)">
      <circle cx="5" cy="93" r="3" fill="#49D6C3"/>
      <text x="16" y="97" fill="#49D6C3" font-size="10" font-weight="700" letter-spacing="1.2">03 / ELECTION DASHBOARD</text>
      <text x="0" y="133" fill="#65E1CE" font-size="27" font-weight="700">234</text>
      <text x="61" y="132" fill="#C9D1D9" font-size="9.5" letter-spacing="1.1">CONSTITUENCIES</text>
      <path d="M0 146H232" stroke="#293944"/>
      <text x="0" y="166" fill="#E6EDF3" font-size="10" letter-spacing="1">60S REFRESH / LIVE</text>
      <g transform="translate(184 112)" fill="#244740">
        <circle cx="5" cy="5" r="5"/><circle cx="21" cy="5" r="5"/><circle cx="37" cy="5" r="5"/>
        <circle cx="5" cy="21" r="5"/><circle cx="21" cy="21" r="5"/><circle cx="37" cy="21" r="5"/>
      </g>
      <g transform="translate(184 112)" fill="#49D6C3" opacity="0.75" class="motion">
        <circle cx="5" cy="5" r="5"><animate attributeName="opacity" values=".2;.2;1;1;.2" keyTimes="0;.67;.72;.92;1" dur="7s" repeatCount="indefinite"/></circle>
        <circle cx="21" cy="5" r="5"><animate attributeName="opacity" values=".2;.2;1;1;.2" keyTimes="0;.7;.75;.92;1" dur="7s" repeatCount="indefinite"/></circle>
        <circle cx="37" cy="5" r="5"><animate attributeName="opacity" values=".2;.2;1;1;.2" keyTimes="0;.73;.78;.92;1" dur="7s" repeatCount="indefinite"/></circle>
        <circle cx="5" cy="21" r="5"><animate attributeName="opacity" values=".2;.2;1;1;.2" keyTimes="0;.76;.81;.92;1" dur="7s" repeatCount="indefinite"/></circle>
        <circle cx="21" cy="21" r="5"><animate attributeName="opacity" values=".2;.2;1;1;.2" keyTimes="0;.79;.84;.92;1" dur="7s" repeatCount="indefinite"/></circle>
        <circle cx="37" cy="21" r="5"><animate attributeName="opacity" values=".2;.2;1;1;.2" keyTimes="0;.82;.87;.92;1" dur="7s" repeatCount="indefinite"/></circle>
      </g>
      <circle cx="225" cy="163" r="3" fill="#49D6C3"><animate class="motion" attributeName="opacity" values=".25;1;.25" dur="2s" repeatCount="indefinite"/></circle>
      <text x="0" y="185" fill="#72818B" font-size="8.5" letter-spacing="1">SEARCH / FILTER / MAJORITY</text>
    </g>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="8.5" letter-spacing="1.2">
    <text x="28" y="218" fill="#60707A">SIGNAL PATH / BUILD → MEASURE → DEPLOY</text>
    <text x="892" y="218" text-anchor="end" fill="#F4B942">SYSTEMS / ACTIVE</text>
  </g>
</svg>
